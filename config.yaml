# Standard-Konfiguration für den Backtest.
# Alle Werte können per CLI-Flag überschrieben werden (siehe: python -m src.main --help)

symbol: "BTC/USDT,ETH/USDT"
timeframe: "1m"
since: "2024-06-01T00:00:00Z"
until: "2024-06-08T00:00:00Z"

capital: 10000
risk_pct: 0.02          # 2% Kapitalrisiko pro Trade (1-3% empfohlen)
max_leverage: 2.5        # Deckelt den automatisch berechneten Hebel

lookback: 15               # Kerzen für Range- und Volumen-Durchschnitt
volume_multiplier: 1.5    # Volumen-Spitze = Volumen > 1.5x Durchschnitt
atr_period: 14
atr_multiplier: 1.5       # Stop-Distanz = ATR * Multiplikator
ema_fast: 9                # Für Gegenbewegungs-/Reversal-Erkennung
cooldown_bars: 0            # keine Sperrfrist (Zielfrequenz ~40 Trades/Tag)
breakout_confirm_bars: 3   # Preis muss 3 Kerzen jenseits des Ausbruchs-Levels bleiben, bevor eingestiegen wird
partial_tp_r_multiple: 2.0  # bei 2R Gewinn: Teil schließen (deckt Stop-Loss-Kosten), Rest-Stop auf Breakeven

trend_timeframe: "1h"       # höherer Zeitrahmen für den Trendfilter
trend_ema: 50                 # EMA-Periode auf dem höheren Zeitrahmen
vol_lookback: 100             # Kerzen für den langfristigen ATR-Schnitt (Volatilitäts-Regime)
vol_expansion_multiplier: 1.2  # nur handeln, wenn ATR > 1.2x langfristiger ATR-Schnitt

allow_shorts: true
fee_pct: 0.0004            # 0.04% Taker-Gebühr pro Seite (Binance Futures Standard)
output_dir: "results"
